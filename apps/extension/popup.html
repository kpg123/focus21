<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus21</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">Focus21</div>
      <div id="status" class="status">Checking…</div>
    </header>
    <p id="stats" class="stats"></p>
    <label>
      API base
      <input id="apiBase" type="url" value="http://localhost:4000" />
    </label>
    <label>
      Email
      <input id="email" type="email" value="viewer@focus21.dev" />
    </label>
    <label>
      Password
      <input id="password" type="password" value="password123" />
    </label>
    <div class="actions">
      <button id="login" type="button">Sign in</button>
      <button id="logout" type="button" class="ghost" hidden>Sign out</button>
      <button id="match" type="button" class="ghost" hidden>Check surveys</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
